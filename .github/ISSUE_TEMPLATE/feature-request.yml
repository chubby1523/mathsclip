name: Feature request
description: Suggest a new format, setting or workflow.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like MathsClip to do?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Where do you paste the result?
      description: For example Obsidian, Overleaf, Anki, Notion, Word.
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A page, and the output you'd like to get from it.
